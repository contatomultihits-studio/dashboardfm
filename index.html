<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard FM</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar-content">
        <h1>🎵 Dashboard FM <small class="version">v4</small></h1>
        <nav id="tabs" class="tabs">
          <button data-tab="metricas" class="tab active">Métricas</button>
          <button data-tab="gerenciamento" class="tab">Gerenciamento</button>
          <button data-tab="gestor" class="tab">Gestor</button>
        </nav>
        <button id="btn-supabase" class="config-btn">Conectar Supabase</button>
      </div>
    </header>

    <main class="container">
      <section id="metricas" class="view active">
        <div class="grid cols-2">
          <form id="form-participacao" class="card form">
            <h3>INCLUIR PARTICIPAÇÕES</h3>
            <label>Programa</label>
            <select id="p-programa" required></select>
            <label>Data de referência</label>
            <input id="p-data" type="date" required />
            <label>Quantidade</label>
            <input id="p-quantidade" type="number" min="0" required />
            <label>Tipo de registro</label>
            <input id="p-tipo" value="telefonema" required />
            <button type="submit">Salvar participação</button>
          </form>
        </div>
      </section>

      <section id="gerenciamento" class="view">
        <div class="grid cols-3">
          <form id="form-programa" class="card form">
            <h3>Novo programa</h3>
            <label>Nome</label>
            <input id="g-programa-nome" required />
            <label>Cor</label>
            <input id="g-programa-cor" type="color" value="#2563eb" required />
            <label class="inline"><input id="g-programa-ativo" type="checkbox" checked /> Ativo</label>
            <button type="submit">Adicionar programa</button>
          </form>

          <form id="form-premio" class="card form">
            <h3>Novo prêmio</h3>
            <label>Programa</label>
            <select id="g-premio-programa" required></select>
            <label>Nome</label>
            <input id="g-premio-nome" required />
            <label>Descrição</label>
            <textarea id="g-premio-desc" rows="3" required></textarea>
            <label>Estoque inicial</label>
            <input id="g-premio-estoque" type="number" min="0" required />
            <button type="submit">Adicionar prêmio</button>
          </form>

          <form id="form-prioridade" class="card form">
            <h3>Prioridade no ar</h3>
            <label>Programa</label>
            <select id="pr-programa" required></select>
            <label>Data</label>
            <input id="pr-data" type="date" required />
            <label>Conteúdo</label>
            <textarea id="pr-conteudo" rows="3" required></textarea>
            <button type="submit">Salvar prioridade</button>
          </form>
        </div>

        <div class="card">
          <h3>Programas</h3>
          <table id="tabela-programas" class="table"></table>
        </div>
      </section>

      <section id="gestor" class="view">
        <div class="card filters">
          <div>
            <small id="periodo-label">DADOS DO MÊS</small>
            <h3 style="margin: 0.3rem 0 0">Visão executiva</h3>
          </div>
          <div class="range">
            <label>De <input id="filtro-de" type="date" /></label>
            <label>Até <input id="filtro-ate" type="date" /></label>
            <button id="btn-aplicar-filtro" type="button">Aplicar filtro</button>
          </div>
        </div>

        <div class="grid cols-3" id="kpis"></div>
        <div class="card">
          <h3>Participações por programa</h3>
          <div id="bars"></div>
        </div>
        <div class="card">
          <h3>Ranking</h3>
          <table id="tabela-ranking" class="table"></table>
        </div>
        <div class="card">
          <h3>Prêmios da hora</h3>
          <table id="tabela-premios" class="table"></table>
        </div>
      </section>
    </main>

    <div id="toast"></div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./config.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
